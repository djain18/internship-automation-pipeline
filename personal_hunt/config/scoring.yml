publish_threshold: 70
daily_target: 10
# LLM shortlist size, separate from daily_target (the digest's display cap).
# 2026-09-13: run_6e74f84cd7c98afb had daily_target=10 doing both jobs, so
# any eligible record past #10 never reached the Kimi gate at all. Set to
# absorb the ~26 eligible records the tripled LinkedIn volume (see
# sources.yml max_items) is expected to produce.
llm_shortlist_size: 30
daily_min_target: 5
# 2026-09-13: raised 2 -> 6 so the deep-research/prototype-prompt chain can
# cover a full 5-admitted day instead of only the top 2.
max_artifacts: 6
max_employees: 400
preferred_max_employees: 150
funding_recency_days: 365
max_posting_age_days: 10
min_duration_months: 2
max_duration_months: 12
validate_application_links: true
adaptive_apify_topup: true
# Daksh 2026-09-11: run the LinkedIn actor on every scheduled run, not only
# below the daily minimum. The dual paid gate stays: dry runs never spend.
linkedin_every_run: true
llm_fit_threshold: 70
max_role_judgements_per_run: 25
# 2026-09-12: was a hardcoded LINKEDIN_EXTRACTION_LIMIT=10 in llm_rank.py.
# On 2026-09-12, 76 of 99 identity-missing LinkedIn posts qualified for
# extraction but only 10 were attempted, dropping same-day exact-match
# roles (e.g. Auraaison Founder's Office Intern) purely for want of a
# parse. Set above the actor's own max_items:150 ceiling, chunked into
# batches per call (see MAX_LINKEDIN_EXTRACTION_BATCH in llm_rank.py) so a
# single oversized prompt cannot truncate and lose the tail.
# 2026-09-13: raised 100 -> 150 (the actor's own max_items ceiling).
# run_f9ae04eb99b98d0e reported 112 candidates and skipped_over_cap: 12, and
# extraction is the only step that turns a raw LinkedIn post into an eligible
# record, so a skipped candidate is a lost match. Measured cost of 4 extraction
# calls that run: $0.00 against a $0.70 per-run ceiling.
# 2026-09-13: raised 150 -> 300, matching the actor's own max_items/maxPosts
# raise in sources.yml (105 raw / 9 of 10 eligible on run_6e74f84cd7c98afb --
# the highest-yield source by far). Extraction cap must never sit behind the
# actor cap or paid-for posts get silently discarded.
max_linkedin_extractions_per_run: 300
# Unverified LinkedIn leads shown per run for manual checking. Capped so a
# long tail of low-confidence leads cannot bury the approved matches.
max_needs_verification: 10
# Application throughput: how many manual sends the digest pushes per day,
# and when an approved-but-unsent lead counts as going stale.
daily_send_quota: 3
stale_after_days: 3
# Hunter.io contact finder: fills records that have no usable email. Finder
# only; verification costs extra credits and stays off unless enabled here.
hunter_enabled: true
hunter_verify: false
hunter_min_confidence: 80
hunter_limit_per_domain: 10
hunter_monthly_max_searches: 25
hunter_monthly_max_verifications: 0
weekly_target_max_items: 3
# Live office checks for weekly-lane companies without Bengaluru location
# text. Bounded fetches per Monday run; HQ may be anywhere.
weekly_office_check_max: 12
weekly_target_signal_days: 90
weekly_target_recent_signal_days: 30
funding_primary_age_days: 15
funding_extension_age_days: 30
funding_primary_min_items: 3
funding_max_items: 5
# 2026-09-13: how many funding events per run get a Firecrawl-search domain
# resolution attempt (each is a live search + a live page fetch to verify).
# Capped independently of max_deep_research_per_run -- resolution has to
# happen before a company is even eligible for deep research.
max_url_resolutions_per_run: 5
# Phase 2: Deep problem research on funded companies
max_deep_research_per_run: 8
deep_research_min_evidence: 2
deep_research_sector_bonus: 3.0

weights:
  location: 20
  role_breadth: 20
  lane_fit: 15
  candidate_fit: 15
  company_size: 10
  funding_growth: 10
  learning: 5
  source_contact: 5

lane_quota:
  ai: 5
  consumer: 5

confidence:
  official: 1.0
  high: 0.9
  medium: 0.7
  low: 0.4
  unverified: 0.2
