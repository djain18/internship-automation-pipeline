# Tier 1 role families Daksh named. Matched against the TITLE only: these are
# broad words that appear incidentally in almost any description ("our growth",
# "the operations team"), so description-wide matching would admit unrelated
# roles. Description-level judgement is Tier 2 (llm_rank.judge_cross_functional).
accepted_title:
  - generalist
  - growth
  - operations
  - ops
  - strategy
  - chief of staff
  - business development
  - business operations
  - biz ops
  - bizops
  - revenue operations
  - partnerships

# Broad titles need evidence of founder/leadership exposure or work spanning at
# least two functions. Otherwise they go to the bounded Tier 2 description read.
broad_title_requires_evidence:
  - growth
  - operations
  - ops
  - strategy
  - business development
  - business operations
  - biz ops
  - bizops
  - revenue operations
  - partnerships

